name: Simple uv python flow
description: Example workflow using a UV Python task
cron: "*/2 * * * * *"
start_time: 2025-01-20T12:30:00+00:00
tasks:
  task0:
    name: get cwd
    description: Get current working directory
    config:
      !Subprocess
      cmd: "pwd"
      args: []

  task1:
    name: Simple uv py
    description: Example UV Python task
    depends:
      - task0
    config:
      !UvPython
      script_path: ./uv_py.py
      packages:
        - pandas>=2.3.1,<3.0.0
      is_uv_project: false
      working_directory: ./test_artifacts

  task2:
    name: simulate sleep
    description: Example UV Python task
    depends:
      - task1
    config:
      !Subprocess
      cmd: "echo"
      args:
        - "Simulating sleep for 5 seconds..."
      working_directory: ./test_artifacts

  task3:
    name: simulate sleep 2
    description: Executes the sleep command to simulate a long-running task
    depends:
      - task2
    config:
      !Subprocess
      cmd: "sleep"
      args:
        - "5"
      working_directory: ./test_artifacts

  task4:
    name: list files
    description: List files in the test_artifacts directory
    depends:
      - task3
    config:
      !Subprocess
      cmd: "ls"
      args: ["-la"]
      working_directory: ./test_artifacts

  task5:
    name: confirm complete
    description: Confirm that the workflow has completed successfully
    depends:
      - task4
    config:
      !Subprocess
      cmd: "echo"
      args: ["Workflow completed successfully!"]
      working_directory: ./test_artifacts